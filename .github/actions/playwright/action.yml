name: Playwright Chromium
description: The browser the `storybook` Vitest project renders in. The binary is cached on the lockfile, so a Playwright bump re-downloads it; its system libraries are apt packages and install every time.

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      run: pnpm exec playwright install --with-deps chromium
